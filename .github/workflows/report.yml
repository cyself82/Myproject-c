# 매일 미국장 마감 후 리포트를 다시 만들어 GitHub Pages에 올린다.
name: SOXL report

on:
  push:
    branches: [main]           # 코드를 올릴 때마다 바로 다시 게시
  schedule:
    - cron: "30 22 * * 1-5"   # 평일 22:30 UTC (한국 시간 다음 날 아침 7:30)
  workflow_dispatch:           # GitHub 화면에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python soxl_signal.py --report --no-open
        env:
          PYTHONUTF8: "1"
      - run: mkdir site && cp soxl_report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
